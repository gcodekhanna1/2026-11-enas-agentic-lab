<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" width="1120" height="460" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">How the reminder flows from your portal to an inbox</title>
  <desc id="d">Two ways in, on the table leader's laptop: clicking Send Reminder, or typing a request that a small local model turns into a fixed format. Both go to the portal's code, which sends the request with the access key over the internet to the workshop MCP server. Its send_reminder tool emails the table's lab account, which forwards to the table leader's inbox.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#286dc0"/>
    </marker>
  </defs>
  <rect width="1120" height="460" fill="#ffffff"/>

  <!-- the laptop -->
  <rect x="20" y="40" width="470" height="400" rx="16" fill="#f6f8fb" stroke="#286dc0" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="255" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#00356b">THE TABLE LEADER'S LAPTOP</text>
  <text x="255" y="92" text-anchor="middle" font-size="14" fill="#5a6b80" font-style="italic">Stays on your laptop</text>

  <!-- path 1: button -->
  <text x="135" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#00356b">The button…</text>
  <rect x="40" y="138" width="190" height="100" rx="10" fill="#e8eef6" stroke="#286dc0" stroke-width="1.5"/>
  <text x="135" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#00356b">You click</text>
  <text x="135" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#00356b">"Send Reminder"</text>
  <text x="135" y="222" text-anchor="middle" font-size="13" fill="#3b4a5c">in your portal</text>

  <!-- portal's code -->
  <rect x="280" y="138" width="190" height="100" rx="10" fill="#00356b"/>
  <text x="375" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Your portal's code</text>
  <text x="375" y="202" text-anchor="middle" font-size="13" fill="#d6e2f2">sends the request,</text>
  <text x="375" y="220" text-anchor="middle" font-size="13" fill="#d6e2f2">with the access key</text>
  <line x1="230" y1="188" x2="276" y2="188" stroke="#286dc0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- path 2: chat -->
  <text x="135" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#00356b">…or the chat window</text>
  <rect x="40" y="302" width="190" height="110" rx="10" fill="#e8eef6" stroke="#286dc0" stroke-width="1.5"/>
  <text x="135" y="338" text-anchor="middle" font-size="17" font-weight="700" fill="#00356b">You type a request</text>
  <text x="135" y="362" text-anchor="middle" font-size="13" fill="#3b4a5c" font-style="italic">"Remind us about</text>
  <text x="135" y="380" text-anchor="middle" font-size="13" fill="#3b4a5c" font-style="italic">Goldman on Friday"</text>
  <rect x="280" y="302" width="190" height="110" rx="10" fill="#e8eef6" stroke="#286dc0" stroke-width="1.5"/>
  <text x="375" y="334" text-anchor="middle" font-size="17" font-weight="700" fill="#00356b">Small Qwen model</text>
  <text x="375" y="356" text-anchor="middle" font-size="13" fill="#3b4a5c">fills in a fixed format:</text>
  <text x="375" y="374" text-anchor="middle" font-size="13" fill="#3b4a5c">action, internship, date</text>
  <text x="375" y="396" text-anchor="middle" font-size="12" fill="#5a6b80">(no internet needed)</text>
  <line x1="230" y1="357" x2="276" y2="357" stroke="#286dc0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="302" x2="375" y2="242" stroke="#286dc0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- over the internet -->
  <line x1="470" y1="188" x2="566" y2="188" stroke="#286dc0" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="518" y="176" text-anchor="middle" font-size="12" fill="#5a6b80">over the</text>
  <text x="518" y="212" text-anchor="middle" font-size="12" fill="#5a6b80">internet</text>

  <!-- MCP server -->
  <rect x="570" y="128" width="210" height="120" rx="10" fill="#286dc0"/>
  <text x="675" y="164" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Workshop MCP server</text>
  <text x="675" y="188" text-anchor="middle" font-size="13" fill="#e8eef6">mcp.paradigmventures.ai</text>
  <text x="675" y="214" text-anchor="middle" font-size="13" fill="#ffffff">runs its tool:</text>
  <text x="675" y="234" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#ffffff">send_reminder</text>

  <!-- lab account -->
  <line x1="780" y1="188" x2="836" y2="188" stroke="#286dc0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="808" y="176" text-anchor="middle" font-size="12" fill="#5a6b80">email +</text>
  <text x="808" y="212" text-anchor="middle" font-size="12" fill="#5a6b80">invite</text>
  <rect x="840" y="138" width="250" height="100" rx="10" fill="#fff8e6" stroke="#978d85" stroke-width="1.5"/>
  <text x="965" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#00356b">Your table's lab account</text>
  <text x="965" y="202" text-anchor="middle" font-size="13" fill="#3b4a5c">for example</text>
  <text x="965" y="220" text-anchor="middle" font-size="13" fill="#3b4a5c">demo-03@paradigmventures.ai</text>

  <!-- inbox -->
  <line x1="965" y1="238" x2="965" y2="298" stroke="#286dc0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="975" y="273" font-size="12" fill="#5a6b80">forwards</text>
  <rect x="840" y="302" width="250" height="110" rx="10" fill="#fff8e6" stroke="#978d85" stroke-width="1.5"/>
  <text x="965" y="346" text-anchor="middle" font-size="17" font-weight="700" fill="#00356b">The table leader's inbox</text>
  <text x="965" y="372" text-anchor="middle" font-size="13" fill="#3b4a5c">the reminder arrives, with</text>
  <text x="965" y="390" text-anchor="middle" font-size="13" fill="#3b4a5c">a calendar invite if dated</text>

</svg>
